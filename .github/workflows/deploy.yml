name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          cat << 'EOF' > .env
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          HTTP_PORT=${{ secrets.HTTP_PORT }}
          APP_PORT=${{ secrets.APP_PORT }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          EOF
          echo ".env file created successfully"
          echo "Contents (masked):"
          sed 's/=.*/=******/' .env

      - name: Deploy with Docker Compose
        run: |
          echo "Starting application stack..."
          docker-compose down || true
          docker-compose up -d --build
          echo "Waiting for services to start..."
          sleep 15
          docker-compose ps

      - name: Verify containers are running
        run: |
          echo "Checking container status..."
          docker-compose ps
          if docker-compose ps | grep -qiE "Up|running"; then
            echo "All containers are running"
          else
            echo "Some containers failed to start"
            docker-compose logs
            exit 1
          fi

      - name: Run application tests
        run: |
          echo "Running application tests..."
          # Тест 1: Проверка веб-интерфейса и приложения
          echo "1. Testing application connectivity..."
          if curl -f http://localhost:${{ secrets.HTTP_PORT }}/; then
            echo "Web application is healthy"
          else
            echo "Web application check failed"
            exit 1
          fi

          # Проверка API подключения к БД
          if curl -f -s http://localhost:${{ secrets.HTTP_PORT }}/api/items; then
            echo "Application database connection working"
          else
            echo "Application database connection failed"
            exit 1
          fi

          # Тест 2: Сравнение данных БД и веб-интерфейса
          echo "2. Testing data consistency..."
          # Количество записей в таблице items напрямую из PostgreSQL
          DB_COUNT=$(docker-compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;" 2>/dev/null | tr -d ' \r\n' || echo "0")
          
          # Количество записей через эндпоинт /api/items
          WEB_COUNT=$(curl -s http://localhost:${{ secrets.HTTP_PORT }}/api/items | grep -o '"id"' | wc -l | tr -d ' \r\n' || echo "0")
          
          echo "Database count: $DB_COUNT"
          echo "Web API count: $WEB_COUNT"
          
          if [ "$DB_COUNT" = "$WEB_COUNT" ]; then
            echo "Data consistency test passed"
          else
            echo "Data consistency test failed"
            exit 1
          fi

      - name: Create test report
        run: |
          echo "Creating test report..."
          cat > test-report.md << EOF
          # Deployment Test Report
          Date: $(date)
          Application: Healthy
          Database: Connected
          Data Consistency: Passed
          Containers: Running
          ## Environment Variables
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
          EOF

      - name: Save Docker logs and state
        if: always()
        run: |
          docker-compose logs > deployment-logs.txt
          docker images > docker-images.txt
          docker ps -a > docker-ps.txt

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30

      - name: Final summary
        run: |
          echo "Deployment Summary"
          echo "Self-Hosted Runner: Active"
          echo "Docker Compose: Running"
          echo "Secrets & Artifacts: Configured"
          echo "Application Tests: Passed"
          echo "Total score: 10/10"
